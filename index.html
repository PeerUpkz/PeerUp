<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PeerUp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Nunito:wght@500;700;800&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  /* public: тетрадь */
  --paper:#FAFBFD;--paper-2:#F1F5FA;--grid:#DCE6F3;--card:#FFFFFF;--line:#C8D5E8;--ink:#12213D;--ink-2:#4F607C;
  --pen:#1F46B4;--on-pen:#FFFFFF;--pen-soft:#E4ECFB;--red:#D3302C;--mark:#FFE98A;--ok:#1B7F4B;--warn:#A35A00;
  /* admin: пульт */
  --ad-bg:#F3F5F4;--ad-panel:#FFFFFF;--ad-panel2:#ECF0EE;--ad-line:#D5DCD9;--ad-ink:#0E1B1A;--ad-mute:#5B6B68;
  --ad-acc:#0B6E65;--ad-on:#FFFFFF;--ad-ok:#1B7F4B;--ad-warn:#A35A00;--ad-bad:#C2362F;
  /* student: приложение */
  --st-bg:#FFF6EA;--st-card:#FFFFFF;--st-ink:#2A1B3D;--st-mute:#6E5F80;--st-acc:#E5481F;--st-acc2:#5B3FE0;
  --st-on:#FFFFFF;--st-soft:#FFE6D9;--st-line:#F1D9C3;--st-yel:#FFC93C;
  --cu-bg:#F5F3FF;--cu-card:#FFFFFF;--cu-ink:#1E1B4B;--cu-mute:#5B5890;--cu-acc:#4F46E5;--cu-on:#FFFFFF;--cu-soft:#E7E5FF;--cu-line:#D9D6F5;--cu-ok:#15803D;--cu-warn:#B45309;
  --view-bg:var(--paper);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1526;--paper-2:#121C31;--grid:#1B2A47;--card:#15213A;--line:#2A3B5E;--ink:#E8EEFA;--ink-2:#9DB0CF;
  --pen:#7C9DFF;--on-pen:#0B1430;--pen-soft:#1A2850;--red:#FF7770;--mark:rgba(255,214,90,.30);--ok:#5FD39A;--warn:#F2B35B;
  --ad-bg:#0C1211;--ad-panel:#131C1B;--ad-panel2:#1A2625;--ad-line:#243433;--ad-ink:#E6F0EE;--ad-mute:#8FA6A2;
  --ad-acc:#3FD0BF;--ad-on:#05201C;--ad-ok:#5FD39A;--ad-warn:#F2B35B;--ad-bad:#FF7770;
  --st-bg:#17102A;--st-card:#231A3D;--st-ink:#F4EEFF;--st-mute:#B3A6D1;--st-acc:#FF7A59;--st-acc2:#9B86FF;
  --st-on:#1A0F10;--st-soft:#3A2450;--st-line:#3A2D5C;--st-yel:#FFD25E;--cu-bg:#0F0E24;--cu-card:#191838;--cu-ink:#ECEBFF;--cu-mute:#A5A3D6;--cu-acc:#8B8BFF;--cu-on:#0B0A20;--cu-soft:#26244F;--cu-line:#302E5E;--cu-ok:#5FD39A;--cu-warn:#F2B35B;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1526;--paper-2:#121C31;--grid:#1B2A47;--card:#15213A;--line:#2A3B5E;--ink:#E8EEFA;--ink-2:#9DB0CF;
  --pen:#7C9DFF;--on-pen:#0B1430;--pen-soft:#1A2850;--red:#FF7770;--mark:rgba(255,214,90,.30);--ok:#5FD39A;--warn:#F2B35B;
  --ad-bg:#0C1211;--ad-panel:#131C1B;--ad-panel2:#1A2625;--ad-line:#243433;--ad-ink:#E6F0EE;--ad-mute:#8FA6A2;
  --ad-acc:#3FD0BF;--ad-on:#05201C;--ad-ok:#5FD39A;--ad-warn:#F2B35B;--ad-bad:#FF7770;
  --st-bg:#17102A;--st-card:#231A3D;--st-ink:#F4EEFF;--st-mute:#B3A6D1;--st-acc:#FF7A59;--st-acc2:#9B86FF;
  --st-on:#1A0F10;--st-soft:#3A2450;--st-line:#3A2D5C;--st-yel:#FFD25E;--cu-bg:#0F0E24;--cu-card:#191838;--cu-ink:#ECEBFF;--cu-mute:#A5A3D6;--cu-acc:#8B8BFF;--cu-on:#0B0A20;--cu-soft:#26244F;--cu-line:#302E5E;--cu-ok:#5FD39A;--cu-warn:#F2B35B;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--view-bg);padding-block:0;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.v-public{--view-bg:var(--paper);color:var(--ink);font:16px/1.55 'Onest',system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
body.v-admin{--view-bg:var(--ad-bg);color:var(--ad-ink);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif}
body.v-student{--view-bg:var(--st-bg);color:var(--st-ink);font:16px/1.5 'Nunito',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--view-bg);z-index:60}
h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.full{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== PUBLIC ===== */
.pu .hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1.5px solid var(--line)}
.pu .hdr .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.pu .brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.pu .brand i{width:30px;height:30px;border-radius:8px;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;font-style:normal;font-size:.8rem}
.pu .nav{display:flex;gap:2px}.pu .nav button{background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.pu .nav button:hover{background:var(--pen-soft);color:var(--pen)}
@media(max-width:820px){.pu .nav{display:none}}
.pbtn{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--pen);background:var(--pen);color:var(--on-pen);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.pbtn.ghost{background:transparent;color:var(--pen)}.pbtn.sm{padding:7px 12px;font-size:.9rem}
.pu .sec{padding-block:42px}.pu .sec>h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;margin-bottom:20px}
.pu .lead{color:var(--ink-2);max-width:62ch;margin-bottom:18px}
.pu .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.pu .card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.pu .card h3{font-size:1.06rem;margin-bottom:6px}.pu .card p{color:var(--ink-2);font-size:.95rem}
.pu .hero{display:grid;gap:28px;grid-template-columns:1.1fr .9fr;align-items:center;padding-block:46px 26px}
@media(max-width:820px){.pu .hero{grid-template-columns:1fr}}
.pu .eyebrow{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--pen);font-weight:700}
.pu .hero h1{font-size:clamp(2.1rem,6.4vw,3.5rem);font-weight:800;margin:4px 0 16px;letter-spacing:-.02em}
.pu mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit}
.pu .hero p.t{color:var(--ink-2);font-size:1.08rem;max-width:52ch;margin-bottom:20px}
.pu .note{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--red);border-radius:6px 14px 14px 6px;padding:18px 18px 22px 20px;position:relative;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--grid) 31px 32px);transform:rotate(1.2deg)}
.pu .note small{display:block;font-weight:600;color:var(--ink-2);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;background:var(--card);width:max-content;max-width:100%;padding-right:6px}
.pu .ln{font-family:'Caveat',cursive;font-size:1.7rem;line-height:32px;color:var(--pen);font-weight:500}
.pu .rv{font-family:'Caveat',cursive;font-size:1.45rem;line-height:1.15;color:var(--red);font-weight:700;margin-top:10px;padding-right:60px}
.pu .gr{position:absolute;right:16px;bottom:14px;font-family:'Caveat',cursive;font-weight:700;font-size:3rem;color:var(--red);border:3px solid var(--red);border-radius:50%;width:58px;height:58px;display:grid;place-items:center;transform:rotate(-10deg);line-height:1}
.pu .chip{display:inline-block;background:var(--pen-soft);color:var(--pen);padding:4px 11px;border-radius:999px;font-weight:600;font-size:.88rem;border:0}
.pu .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pu .filters button{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.pu .filters button[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.pu .step .n{font-family:'Caveat',cursive;font-size:2.2rem;color:var(--pen);font-weight:700;line-height:1}
.pu .tcard{display:flex;flex-direction:column;gap:8px}
.pu .ava{width:46px;height:46px;border-radius:50%;background:var(--pen-soft);color:var(--pen);display:grid;place-items:center;font-weight:800}
.pu .price{display:flex;flex-direction:column;gap:10px;position:relative}.pu .price.hl{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.pu .badge{position:absolute;top:-12px;right:14px;background:var(--pen);color:var(--on-pen);font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}
.pu .amt{font-size:2.2rem;font-weight:800;line-height:1}.pu .amt small{display:block;font-size:.88rem;font-weight:500;color:var(--ink-2);margin-top:4px}
.pu ul.ticks{list-style:none;margin:0;padding:0;display:grid;gap:6px}.pu ul.ticks li{padding-left:24px;position:relative}
.pu ul.ticks li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.pu .faq details{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 16px}.pu .faq details+details{margin-top:10px}
.pu .faq summary{cursor:pointer;font-weight:600;padding:14px 0}.pu .faq details p{color:var(--ink-2);padding-bottom:14px}
.pu .contact{background:var(--pen);color:var(--on-pen);border-radius:18px;padding:28px;display:grid;gap:14px}
.pu .contact .pbtn{background:var(--on-pen);color:var(--pen);border-color:var(--on-pen)}
.pu .ftr{padding-block:26px 40px;color:var(--ink-2);font-size:.9rem;border-top:1.5px solid var(--line);margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.demo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.demo small{opacity:.7;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.pu .demo button{background:var(--paper-2);border:1.5px dashed var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;color:var(--ink-2)}
@media(max-width:560px){.pu .demo small{display:none}}

/* ===== ADMIN ===== */
.ad{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;min-height:100vh;
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
@media(max-width:860px){.ad{grid-template-columns:minmax(0,1fr)}}
.ad .side{background:var(--ad-panel);border-right:1px solid var(--ad-line);padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
@media(max-width:860px){.ad .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--ad-line);padding:8px max(12px,env(safe-area-inset-left,0px));align-items:center}}
.ad .logo{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:1rem;padding:6px 8px 14px;color:var(--ad-acc);white-space:nowrap}
.ad .logo small{display:block;color:var(--ad-mute);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:860px){.ad .logo{padding:0 8px}.ad .logo small{display:none}}
.ad .side button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ad-mute);white-space:nowrap;font-weight:500}
.ad .side button:hover{background:var(--ad-panel2);color:var(--ad-ink)}
.ad .side button[aria-current="page"]{background:var(--ad-acc);color:var(--ad-on)}
.ad .side .sp{flex:1}
.ad .main{padding:22px max(16px,env(safe-area-inset-right,0px)) 60px 22px;min-width:0;max-width:1100px}
@media(max-width:860px){.ad .main{padding:16px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}}
.ad h1{font-size:1.35rem;font-weight:600;margin-bottom:4px}
.ad .sub{color:var(--ad-mute);margin-bottom:18px}
.ad .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.ad .kpi{background:var(--ad-panel);border:1px solid var(--ad-line);border-radius:6px;padding:12px 14px}
.ad .kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:1.45rem;font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.ad .kpi span{color:var(--ad-mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.ad .panel{background:var(--ad-panel);border:1px solid var(--ad-line);border-radius:6px;padding:14px;margin-bottom:16px;min-width:0}
.ad .panel h2{font-size:.95rem;font-weight:600;margin-bottom:10px}
.ad .tw{overflow-x:auto}
.ad table{border-collapse:collapse;width:100%;min-width:560px}
.ad th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ad-mute);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--ad-line)}
.ad td{padding:8px 10px;border-bottom:1px solid var(--ad-line);vertical-align:middle}
.ad tr:last-child td{border-bottom:0}
.ad .mono{font-family:'IBM Plex Mono',monospace}
.ad .b{background:var(--ad-acc);color:var(--ad-on);border:1px solid var(--ad-acc);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500}
.ad .b.ghost{background:transparent;color:var(--ad-ink);border-color:var(--ad-line)}
.ad .b.sm{padding:3px 8px;font-size:.82rem}
.ad .b.bad{background:transparent;color:var(--ad-bad);border-color:var(--ad-bad)}.ad .b.bad.arm{background:var(--ad-bad);color:#fff}
.ad .tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:.78rem;font-weight:500;background:var(--ad-panel2);color:var(--ad-mute)}
.ad .tag.ok{color:var(--ad-ok)}.ad .tag.warn{color:var(--ad-warn)}.ad .tag.bad{color:var(--ad-bad)}
.ad .frm{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.ad .fl{display:flex;flex-direction:column;gap:3px;min-width:0}.ad .fl span{font-size:.78rem;color:var(--ad-mute)}
.ad .fl input,.ad .fl select,.ad .fl textarea{padding:7px 9px;border:1px solid var(--ad-line);border-radius:5px;background:var(--ad-bg);width:100%;min-width:0}
.ad .bar{height:8px;background:var(--ad-panel2);border-radius:4px;overflow:hidden}.ad .bar i{display:block;height:100%;background:var(--ad-acc)}
.ad .hint{background:var(--ad-panel2);border-left:3px solid var(--ad-acc);padding:8px 12px;border-radius:4px;color:var(--ad-mute);margin-bottom:16px}
.ad .chk{display:flex;gap:6px;align-items:center}

/* ===== STUDENT ===== */
.st .hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--st-bg)}
.st .hdr .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.st .brand{font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.05rem;margin-right:auto;color:var(--st-acc2)}
.st .brand b{color:var(--st-acc)}
.st .ic{background:var(--st-card);border:2px solid var(--st-line);border-radius:14px;padding:7px 11px;cursor:pointer;font-weight:700}
.st .page{max-width:760px;margin:0 auto;padding-block:6px 120px;display:grid;gap:16px}
.st h1{font-family:'Unbounded',sans-serif;font-size:1.35rem;font-weight:700}
.st h2{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:500;margin-bottom:8px}
.st .card{background:var(--st-card);border:2px solid var(--st-line);border-radius:22px;padding:16px;min-width:0}
.st .card.hot{background:var(--st-acc2);border-color:var(--st-acc2);color:#fff}
.st .mute{color:var(--st-mute)}
.st .sb{background:var(--st-acc);color:var(--st-on);border:0;border-radius:14px;padding:10px 16px;font-weight:800;cursor:pointer}
.st .sb.alt{background:var(--st-acc2);color:#fff}.st .sb.ghost{background:transparent;color:var(--st-acc2);border:2px solid var(--st-acc2)}
.st .sb.sm{padding:6px 12px;font-size:.88rem}
.st .pill{display:inline-block;padding:3px 11px;border-radius:999px;font-weight:700;font-size:.82rem;background:var(--st-soft);color:var(--st-ink)}
.st .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--st-card);border-top:2px solid var(--st-line);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.st .tabs button{background:none;border:0;display:grid;gap:0;justify-items:center;padding:4px 8px;border-radius:14px;cursor:pointer;color:var(--st-mute);font-weight:700;font-size:.72rem;min-width:56px}
.st .tabs button span{font-size:1.3rem}
.st .tabs button[aria-current="page"]{color:var(--st-acc);background:var(--st-soft)}
.st .chips{display:flex;gap:8px;flex-wrap:wrap}
.st .chips button{background:var(--st-card);border:2px solid var(--st-line);border-radius:999px;padding:5px 13px;font-weight:700;cursor:pointer}
.st .chips button[aria-pressed="true"]{background:var(--st-acc2);border-color:var(--st-acc2);color:#fff}
.st .fl{display:flex;flex-direction:column;gap:3px}.st .fl span{font-weight:700;font-size:.85rem}
.st input,.st select{padding:9px 11px;border:2px solid var(--st-line);border-radius:12px;background:var(--st-bg);width:100%;min-width:0}
.st .list{display:grid;gap:12px}
.st .cons{display:grid;gap:8px}
.st .ava{width:48px;height:48px;border-radius:16px;background:var(--st-yel);color:#2A1B3D;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:700}
.st .bar{height:14px;background:var(--st-soft);border-radius:999px;overflow:hidden}.st .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--st-acc),var(--st-yel));border-radius:999px}
.st .login{max-width:460px;margin:30px auto;display:grid;gap:16px}
.st .hw{display:flex;gap:12px;align-items:center}.st .hw input{width:24px;height:24px;flex:none;accent-color:var(--st-acc2)}
.st .done{text-decoration:line-through;opacity:.6}

body.v-cabinet{--view-bg:var(--paper-2);color:var(--ink);font:16px/1.5 'Onest',system-ui,sans-serif}
body.v-curator{--view-bg:var(--cu-bg);color:var(--cu-ink);font:15px/1.5 'Manrope',system-ui,sans-serif}
/* public polish */
.pu .card{transition:transform .15s,box-shadow .15s}.pu .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(18,33,61,.08)}
.pu .facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.pu .facts span{border:1.5px dashed var(--line);border-radius:8px;padding:4px 10px;font-size:.88rem;color:var(--ink-2);background:var(--card)}

function doLogin(role,login,password){
  if(role==='admin'){
    // всегда считаем хэш, чтобы время ответа не выдавало, верный ли логин
    return pbkdf2(password,ADMIN.salt).then(function(hx){var ok=login===ADMIN.login&&eqHex(hx,ADMIN.hash);if(ok)setSess({role:'admin'});return ok});
  }
  var acc=DB.accounts.filter(function(a){return a.role===role&&a.login===login})[0];
  var salt=acc?acc.salt:ADMIN.salt;
  return pbkdf2(password,salt).then(function(hx){var ok=!!acc&&eqHex(hx,acc.hash);if(ok)setSess({role:role,ref:acc.ref});return ok});
}

  if(!validLogin(login))return Promise.reject(new Error('Логин: 3–24 символа, латиница, цифры, _ . -'));
  if(login===ADMIN.login||DB.accounts.some(function(a){return a.login===login}))return Promise.reject(new Error('Такой логин уже занят'));

var app=document.getElementById('app');
function render(keepScroll){
  var hash=location.hash.replace('#',''),y=window.scrollY,view='public',node;
  if(hash==='admin'||hash==='student')hash='cabinet';
  if(hash==='cabinet'){
    var s=getSess();
    var me=null;
    if(s&&s.role==='admin'){view='admin';node=viewAdmin()}
    else if(s&&s.role==='curator'&&(me=by(DB.curators,s.ref))&&accOf('curator',s.ref)){view='curator';node=viewCurator(me)}
    else if(s&&s.role==='student'&&(me=by(DB.students,s.ref))&&accOf('student',s.ref)){view='student';node=viewStudent(me)}
    else if(s&&s.role==='parent'&&(me=by(DB.parents,s.ref))&&accOf('parent',s.ref)){view='curator';node=viewParent(me)}
    else if(s&&s.role==='consultant'&&(me=by(DB.consultants,s.ref))&&accOf('consultant',s.ref)){view='curator';node=viewConsultant(me)}
    else{if(s)logout(true);view='cabinet';node=viewCabinet()}
  }else if(hash==='offer')node=viewOffer();
  else{node=viewPublic();node.append(h('div',{class:'wrap',style:'padding:20px 0 40px;text-align:center'},h('button',{class:'pbtn ghost sm',type:'button',onclick:function(){location.hash='offer'}},'Публичная оферта и правила отмены')))}
  document.body.className='v-'+view;
  app.replaceChildren(node);
  if(keepScroll===true)window.scrollTo(0,y);
}
